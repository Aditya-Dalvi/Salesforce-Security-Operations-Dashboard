<template>
<div class={shellCls}>

    <!-- ── HEADER ── -->
    <header class="soc-header">
        <div class="header-left">
            <span class="header-badge">SOC</span>
            <div>
                <h1 class="header-title">Security Operations Center</h1>
                <p class="header-sub">Salesforce Identity &amp; Access Intelligence</p>
            </div>
        </div>
        <div class="header-right">
            <span class="live-dot"></span>
            <span class="live-label">LIVE</span>
            <span class="header-time">{currentTime}</span>
            <button class="theme-btn" onclick={handleThemeToggle} title="Toggle dark / light theme">
                {themeIcon}
            </button>
            <button class="refresh-btn" onclick={handleRefresh} disabled={loading}>
                <template if:true={loading}>
                    <span class="spin">⟳</span>
                </template>
                <template if:false={loading}>⟳ Refresh</template>
            </button>
        </div>
    </header>

    <!-- ── ERROR BANNER ── -->
    <template if:true={errorMessage}>
        <div class="error-banner">⚠ {errorMessage}</div>
    </template>

    <!-- ── TAB NAV ── -->
    <nav class="tab-nav">
        <template for:each={tabs} for:item="tab">
            <button key={tab.id}
                class={tab.cls}
                data-id={tab.id}
                onclick={handleTabClick}>
                <span class="tab-icon">{tab.icon}</span>
                {tab.label}
                <template if:true={tab.count}>
                    <span class={tab.countCls}>{tab.count}</span>
                </template>
            </button>
        </template>
    </nav>

    <!-- ═══════════════════════════════════════════
            TAB: OVERVIEW
    ═══════════════════════════════════════════ -->
    <template if:true={isTabOverview}>
        <div class="section-grid">
            <div class="kpi-card kpi-critical">
                <div class="kpi-label">Critical Risk Users</div>
                <div class="kpi-value">{summary.criticalRiskUsers}</div>
                <div class="kpi-sub">ModifyAll + EncryptedData + No MFA</div>
            </div>
            <div class="kpi-card kpi-red">
                <div class="kpi-label">Modify All Data</div>
                <div class="kpi-value">{summary.modifyAllDataUsers}</div>
                <div class="kpi-sub">Active users (profile)</div>
            </div>
            <div class="kpi-card kpi-red">
                <div class="kpi-label">View Encrypted Data</div>
                <div class="kpi-value">{summary.viewEncryptedUsers}</div>
                <div class="kpi-sub">Sensitive field access</div>
            </div>
            <div class="kpi-card kpi-orange">
                <div class="kpi-label">MFA Disabled</div>
                <div class="kpi-value">{summary.mfaDisabledUsers}</div>
                <div class="kpi-sub">ForceTwoFactor = false</div>
            </div>
            <div class="kpi-card kpi-orange">
                <div class="kpi-label">MFA Bypass</div>
                <div class="kpi-value">{summary.mfaBypassUsers}</div>
                <div class="kpi-sub">Via permission set</div>
            </div>
            <div class="kpi-card kpi-yellow">
                <div class="kpi-label">Dormant Users</div>
                <div class="kpi-value">{summary.dormantUsers}</div>
                <div class="kpi-sub">No login 90+ days</div>
            </div>
            <div class="kpi-card kpi-red">
                <div class="kpi-label">Dormant Privileged</div>
                <div class="kpi-value">{summary.dormantPrivilegedUsers}</div>
                <div class="kpi-sub">Dormant + ModifyAllData</div>
            </div>
            <div class="kpi-card kpi-yellow">
                <div class="kpi-label">Export Enabled</div>
                <div class="kpi-value">{summary.exportEnabledUsers}</div>
                <div class="kpi-sub">Data / Report export</div>
            </div>
            <div class="kpi-card kpi-orange">
                <div class="kpi-label">View All Data</div>
                <div class="kpi-value">{summary.viewAllDataUsers}</div>
                <div class="kpi-sub">Org-wide read access</div>
            </div>
            <div class="kpi-card kpi-yellow">
                <div class="kpi-label">Password Never Expires</div>
                <div class="kpi-value">{summary.passwordNeverExpiresUsers}</div>
                <div class="kpi-sub">Weak password policy</div>
            </div>
            <div class="kpi-card kpi-orange">
                <div class="kpi-label">Failed Logins (24h)</div>
                <div class="kpi-value">{summary.failedLoginsLast24h}</div>
                <div class="kpi-sub">Auth failures</div>
            </div>
            <div class="kpi-card kpi-red">
                <div class="kpi-label">Package Events (30d)</div>
                <div class="kpi-value">{summary.packageInstallEvents}</div>
                <div class="kpi-sub">Audit trail hits</div>
            </div>
        </div>
    </template>

    <!-- ═══════════════════════════════════════════
            TAB: DORMANT ACCOUNTS
    ═══════════════════════════════════════════ -->
    <template if:true={isTabDormant}>
        <div class="tab-content">

            <!-- Sub-tab nav -->
            <div class="sub-tab-nav">
                <button class={dormantSubTabCls.active} data-sub="active" onclick={handleDormantSubTab}>
                    💤 Active Dormant <span class="tab-count">{_dormantUsers.length}</span>
                </button>
                <button class={dormantSubTabCls.frozen} data-sub="frozen" onclick={handleDormantSubTab}>
                    🧊 Frozen Accounts <span class="tab-count">{frozenUsers.length}</span>
                </button>
            </div>

            <!-- ── SUB-TAB: ACTIVE DORMANT ── -->
            <template if:true={isDormantSubActive}>
                <div class="section-header" style="margin-top:14px">
                    <div class="section-header-row">
                        <div>
                            <h2>Dormant Account Detection
                                <span class="rule-tag rule-tag-hoverable"
                                      data-rules="dormant"
                                      onmouseenter={handleRuleTagEnter}
                                      onmouseleave={handleRuleTagLeave}>
                                    Rules H1 H2 H3
                                </span>
                            </h2>
                            <p class="section-desc">Active users with no login for 90+ days. Select accounts and freeze them. System Admins and Integration users are protected.</p>
                        </div>
                        <div class="header-actions">
                            <div class="search-box-wrap">
                                <span class="search-icon">⌕</span>
                                <input type="text" class="search-box"
                                    placeholder="Search name or username…"
                                    value={dormantSearch}
                                    oninput={handleDormantSearch} />
                                <template if:true={dormantSearch}>
                                    <button class="search-clear" onclick={clearDormantSearch}>✕</button>
                                </template>
                            </div>
                            <!-- CSV export is restricted to admin profiles (SocFreezeController.canDownloadCsv) -->
                            <template if:true={canExportCsv}>
                                <button class="csv-btn" onclick={downloadDormantCsv} title="Download CSV">
                                    Download CSV ⬇
                                </button>
                            </template>
                            <template if:false={canExportCsv}>
                                <span class="csv-locked" title={csvLockedTitle}>🔒 Export restricted</span>
                            </template>
                        </div>
                    </div>
                    <div class="filter-bar">
                        <span class="filter-label">Filter by profile:</span>
                        <select class="filter-select" onchange={handleProfileFilter}>
                            <option value="">All Profiles</option>
                            <template for:each={dormantProfileOptions} for:item="opt">
                                <option key={opt} value={opt}>{opt}</option>
                            </template>
                        </select>
                        <span class="filter-label">Permission Set:</span>
                        <select class="filter-select" onchange={handleDormantPermSetFilter}>
                            <option value="">All Permission Sets</option>
                            <template for:each={dormantPermSetOptions} for:item="opt">
                                <option key={opt} value={opt}>{opt}</option>
                            </template>
                        </select>
                        <span class="filter-label">Severity:</span>
                        <select class="filter-select" onchange={handleSeverityFilter}>
                            <option value="">All</option>
                            <option value="Critical">Critical</option>
                            <option value="High">High</option>
                        </select>
                        <span class="results-count">{dormantFilteredCount} users</span>
                        <button class="filter-reset" onclick={resetDormantFilters}>Reset</button>
                    </div>

                    <!-- ── RECORD LIMIT CONTROL ── -->
                    <div class="limit-bar">
                        <span class="filter-label">Records to load:</span>
                        <template for:each={dormantLimitPresets} for:item="p">
                            <button key={p.value} class={p.cls}
                                data-value={p.value}
                                onclick={handleDormantLimitPreset}>{p.label}</button>
                        </template>
                        <span class="filter-label tw-separator">Custom:</span>
                        <input type="number" class="tw-custom-num"
                            min="1" max="10000"
                            value={dormantCustomLimit}
                            oninput={handleDormantCustomLimitInput} />
                        <button class="tw-apply-btn" onclick={applyDormantCustomLimit}>Apply</button>
                        <template if:true={dormantHasMore}>
                            <button class="load-all-btn" onclick={loadAllDormant}>⬇ Load all ({dormantTotalCount})</button>
                        </template>
                        <span class="limit-info">{dormantLimitInfo}</span>
                    </div>
                </div>

                <!-- Freeze action bar -->
                <template if:true={hasDormantSelection}>
                    <div class="action-bar">
                        <span class="action-bar-count">
                            {dormantSelectedCount} user{dormantSelectedCountPlural} selected
                        </span>
                        <button class="action-btn action-btn-freeze"
                            onclick={handleFreezeSelected}
                            disabled={freezeInProgress}>
                            <template if:true={freezeInProgress}>⏳ Freezing…</template>
                            <template if:false={freezeInProgress}>🧊 Freeze Selected</template>
                        </button>
                        <button class="action-btn action-btn-cancel" onclick={clearDormantSelection}>
                            ✕ Clear selection
                        </button>
                    </div>
                </template>

                <!-- Freeze result toast -->
                <template if:true={freezeResultMsg}>
                    <div class={freezeResultCls}>
                        {freezeResultMsg}
                        <button class="toast-close" onclick={clearFreezeResult}>✕</button>
                    </div>
                </template>

                <template if:true={hasDormantUsers}>
                    <div class="table-wrap">
                        <table class="soc-table">
                            <thead>
                                <tr>
                                    <th class="th-check">
                                        <input type="checkbox"
                                            class="soc-checkbox"
                                            checked={allDormantSelected}
                                            onchange={handleSelectAllDormant} />
                                    </th>
                                    <th class="th-sortable" data-col="name" onclick={handleDormantSort}>
                                        Name {dormantSortIcon.name}
                                    </th>
                                    <th class="th-sortable" data-col="userName" onclick={handleDormantSort}>
                                        Username {dormantSortIcon.userName}
                                    </th>
                                    <th class="th-sortable" data-col="profileName" onclick={handleDormantSort}>
                                        Profile {dormantSortIcon.profileName}
                                    </th>
                                    <th class="th-sortable" data-col="lastLoginDate" onclick={handleDormantSort}>
                                        Last Login {dormantSortIcon.lastLoginDate}
                                    </th>
                                    <th class="th-sortable" data-col="dormantDays" onclick={handleDormantSort}>
                                        Days Dormant {dormantSortIcon.dormantDays}
                                    </th>
                                    <th class="th-sortable" data-col="isActive" onclick={handleDormantSort}>
                                        Status {dormantSortIcon.isActive}
                                    </th>
                                    <th>Risk Flags</th>
                                    <th class="th-sortable" data-col="severity" onclick={handleDormantSort}>
                                        Severity {dormantSortIcon.severity}
                                    </th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={dormantUsersFiltered} for:item="u">
                                    <tr key={u.userId} class={u.rowCls}>
                                        <td class="th-check">
                                            <input type="checkbox"
                                                class="soc-checkbox"
                                                data-userid={u.userId}
                                                checked={u.selected}
                                                onchange={handleDormantRowSelect} />
                                        </td>
                                        <td class="cell-name">
                                            <a class="user-link" data-url={u.userUrl} onclick={handleLinkClick}>{u.name}</a>
                                        </td>
                                        <td class="cell-mono">
                                            <a class="user-link user-link-mono" data-url={u.userUrl} onclick={handleLinkClick}>{u.userName}</a>
                                        </td>
                                        <td>
                                            <template if:true={u.profileId}>
                                                <a class="user-link" data-url={u.profileUrl} onclick={handleLinkClick}>{u.profileName}</a>
                                            </template>
                                            <template if:false={u.profileId}>{u.profileName}</template>
                                        </td>
                                        <td class="cell-date">{u.lastLoginDate}</td>
                                        <td class="cell-days">{u.dormantDaysLabel}</td>
                                        <td><span class={u.statusCls}>{u.statusLabel}</span></td>
                                        <td class="cell-flags">{u.riskFlags}</td>
                                        <td><span class={u.severityCls}>{u.severity}</span></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                        <template if:true={dormantNoResults}>
                            <div class="no-results">No users match your search or filters.</div>
                        </template>
                    </div>
                </template>
                <template if:false={hasDormantUsers}>
                    <div class="empty-state">✓ No dormant users found</div>
                </template>
            </template>

            <!-- ── SUB-TAB: FROZEN ACCOUNTS ── -->
            <template if:true={isDormantSubFrozen}>
                <div class="section-header" style="margin-top:14px">
                    <div class="section-header-row">
                        <div>
                            <h2>Frozen Accounts <span class="rule-tag">UserLogin.IsFrozen</span></h2>
                            <p class="section-desc">Users currently frozen in this org. Select and unfreeze to restore access.</p>
                        </div>
                        <div class="header-actions">
                            <div class="search-box-wrap">
                                <span class="search-icon">⌕</span>
                                <input type="text" class="search-box"
                                    placeholder="Search name or username…"
                                    value={frozenSearch}
                                    oninput={handleFrozenSearch} />
                                <template if:true={frozenSearch}>
                                    <button class="search-clear" onclick={clearFrozenSearch}>✕</button>
                                </template>
                            </div>
                            <template if:true={canExportCsv}>
                                <button class="csv-btn" onclick={downloadFrozenCsv} title="Download CSV">
                                    Download CSV ⬇
                                </button>
                            </template>
                            <template if:false={canExportCsv}>
                                <span class="csv-locked" title={csvLockedTitle}>🔒 Export restricted</span>
                            </template>
                        </div>
                    </div>
                </div>

                <!-- Unfreeze action bar -->
                <template if:true={hasFrozenSelection}>
                    <div class="action-bar action-bar-unfreeze">
                        <span class="action-bar-count">
                            {frozenSelectedCount} user{frozenSelectedCountPlural} selected
                        </span>
                        <button class="action-btn action-btn-unfreeze"
                            onclick={handleUnfreezeSelected}
                            disabled={freezeInProgress}>
                            <template if:true={freezeInProgress}>⏳ Unfreezing…</template>
                            <template if:false={freezeInProgress}>🔓 Unfreeze Selected</template>
                        </button>
                        <button class="action-btn action-btn-cancel" onclick={clearFrozenSelection}>
                            ✕ Clear selection
                        </button>
                    </div>
                </template>

                <!-- Unfreeze result toast -->
                <template if:true={unfreezeResultMsg}>
                    <div class={unfreezeResultCls}>
                        {unfreezeResultMsg}
                        <button class="toast-close" onclick={clearUnfreezeResult}>✕</button>
                    </div>
                </template>

                <template if:true={hasFrozenUsers}>
                    <div class="table-wrap">
                        <table class="soc-table">
                            <thead>
                                <tr>
                                    <th class="th-check">
                                        <input type="checkbox"
                                            class="soc-checkbox"
                                            checked={allFrozenSelected}
                                            onchange={handleSelectAllFrozen} />
                                    </th>
                                    <th>Name</th>
                                    <th>Username</th>
                                    <th>Profile</th>
                                    <th>Last Login</th>
                                    <th>Frozen On</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={frozenUsersFiltered} for:item="u">
                                    <tr key={u.userId} class="row-frozen">
                                        <td class="th-check">
                                            <input type="checkbox"
                                                class="soc-checkbox"
                                                data-userid={u.userId}
                                                checked={u.selected}
                                                onchange={handleFrozenRowSelect} />
                                        </td>
                                        <td class="cell-name">
                                            <a class="user-link" data-url={u.userUrl} onclick={handleLinkClick}>{u.name}</a>
                                        </td>
                                        <td class="cell-mono">
                                            <a class="user-link user-link-mono" data-url={u.userUrl} onclick={handleLinkClick}>{u.userName}</a>
                                        </td>
                                        <td>
                                            <template if:true={u.profileId}>
                                                <a class="user-link" data-url={u.profileUrl} onclick={handleLinkClick}>{u.profileName}</a>
                                            </template>
                                            <template if:false={u.profileId}>{u.profileName}</template>
                                        </td>
                                        <td class="cell-date">{u.lastLoginDate}</td>
                                        <td class="cell-date cell-frozen-date">{u.frozenDate}</td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                        <template if:true={frozenNoResults}>
                            <div class="no-results">No frozen users match your search.</div>
                        </template>
                    </div>
                </template>
                <template if:false={hasFrozenUsers}>
                    <div class="empty-state">✓ No frozen accounts found in this org</div>
                </template>
            </template>

        </div>
    </template>

    <!-- ═══════════════════════════════════════════
            TAB: PRIVILEGED ACCESS
    ═══════════════════════════════════════════ -->
    <template if:true={isTabPrivileged}>
        <div class="tab-content">
            <div class="section-header">
                <div class="section-header-row">
                    <div>
                        <h2>Privileged Access Monitoring
                            <span class="rule-tag rule-tag-hoverable"
                                  data-rules="privileged"
                                  onmouseenter={handleRuleTagEnter}
                                  onmouseleave={handleRuleTagLeave}>
                                Rules B1 B2 B3 C1 C2
                            </span>
                        </h2>
                        <p class="section-desc">Users with ModifyAllData, ViewAllData, or ViewEncryptedData. Click any name, username, or profile to open in a new tab.</p>
                    </div>
                    <div class="header-actions">
                        <div class="search-box-wrap">
                            <span class="search-icon">⌕</span>
                            <input type="text" class="search-box"
                                placeholder="Search name or username…"
                                value={privSearch}
                                oninput={handlePrivSearch} />
                            <template if:true={privSearch}>
                                <button class="search-clear" onclick={clearPrivSearch}>✕</button>
                            </template>
                        </div>
                        <template if:true={canExportCsv}>
                            <button class="csv-btn" onclick={downloadPrivCsv} title="Download CSV">
                                Download CSV ⬇
                            </button>
                        </template>
                        <template if:false={canExportCsv}>
                            <span class="csv-locked" title={csvLockedTitle}>🔒 Export restricted</span>
                        </template>
                    </div>
                </div>
                <div class="filter-bar">
                    <span class="filter-label">Profile:</span>
                    <select class="filter-select" onchange={handlePrivProfileFilter}>
                        <option value="">All Profiles</option>
                        <template for:each={privProfileOptions} for:item="opt">
                            <option key={opt} value={opt}>{opt}</option>
                        </template>
                    </select>
                    <span class="filter-label">Permission Set:</span>
                    <select class="filter-select" onchange={handlePrivPermSetFilter}>
                        <option value="">All Permission Sets</option>
                        <template for:each={privPermSetOptions} for:item="opt">
                            <option key={opt} value={opt}>{opt}</option>
                        </template>
                    </select>
                    <span class="filter-label">Severity:</span>
                    <select class="filter-select" onchange={handlePrivSeverityFilter}>
                        <option value="">All</option>
                        <option value="Critical">Critical</option>
                        <option value="High">High</option>
                    </select>
                    <span class="results-count">{privFilteredCount} users</span>
                    <button class="filter-reset" onclick={resetPrivFilters}>Reset</button>
                </div>
                <div class="flag-filter-bar">
                    <span class="filter-label">Risk Flags (AND filter):</span>
                    <template for:each={privFlagOptions} for:item="f">
                        <button key={f.value}
                            class={f.cls}
                            data-flag={f.value}
                            onclick={handlePrivFlagToggle}>
                            {f.label}
                        </button>
                    </template>
                    <template if:true={hasPrivFlagFilter}>
                        <button class="flag-pill flag-pill-clear" onclick={clearPrivFlags}>✕ Clear flags</button>
                    </template>
                </div>
            </div>

            <template if:true={hasPrivilegedUsers}>
                <div class="table-wrap">
                    <table class="soc-table">
                        <thead>
                            <tr>
                                <th class="th-sortable" data-col="name" onclick={handlePrivSort}>Name {privSortIcon.name}</th>
                                <th class="th-sortable" data-col="userName" onclick={handlePrivSort}>Username {privSortIcon.userName}</th>
                                <th class="th-sortable" data-col="profileName" onclick={handlePrivSort}>Profile {privSortIcon.profileName}</th>
                                <th class="th-sortable" data-col="lastLoginDate" onclick={handlePrivSort}>Last Login {privSortIcon.lastLoginDate}</th>
                                <th>Risk Flags</th>
                                <th class="th-sortable" data-col="severity" onclick={handlePrivSort}>Severity {privSortIcon.severity}</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={privUsersFiltered} for:item="u">
                                <tr key={u.userId} class={u.rowCls}>
                                    <td class="cell-name"><a class="user-link" data-url={u.userUrl} onclick={handleLinkClick}>{u.name}</a></td>
                                    <td class="cell-mono"><a class="user-link user-link-mono" data-url={u.userUrl} onclick={handleLinkClick}>{u.userName}</a></td>
                                    <td>
                                        <template if:true={u.profileId}><a class="user-link" data-url={u.profileUrl} onclick={handleLinkClick}>{u.profileName}</a></template>
                                        <template if:false={u.profileId}>{u.profileName}</template>
                                    </td>
                                    <td class="cell-date">{u.lastLoginDate}</td>
                                    <td class="cell-flags-wrap">
                                        <template for:each={u.flagPills} for:item="fp"><span key={fp.label} class={fp.cls}>{fp.label}</span></template>
                                    </td>
                                    <td><span class={u.severityCls}>{u.severity}</span></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                    <template if:true={privNoResults}><div class="no-results">No users match your search or filters.</div></template>
                </div>
            </template>
            <template if:false={hasPrivilegedUsers}><div class="empty-state">✓ No over-privileged users found</div></template>
        </div>
    </template>

    <!-- ═══════════════════════════════════════════
            TAB: EXPORT & DOWNLOAD
    ═══════════════════════════════════════════ -->
    <template if:true={isTabExport}>
        <div class="tab-content">
            <div class="section-header">
                <div class="section-header-row">
                    <div>
                        <h2>Export &amp; Download Monitoring
                            <span class="rule-tag rule-tag-hoverable"
                                  data-rules="export"
                                  onmouseenter={handleRuleTagEnter}
                                  onmouseleave={handleRuleTagLeave}>
                                Rules E1–E5
                            </span>
                        </h2>
                        <p class="section-desc">Users with data export, report export, QueryAllFiles, or BulkHardDelete — exfiltration risk.</p>
                    </div>
                    <div class="header-actions">
                        <div class="search-box-wrap">
                            <span class="search-icon">⌕</span>
                            <input type="text" class="search-box"
                                placeholder="Search name or username…"
                                value={exportSearch}
                                oninput={handleExportSearch} />
                            <template if:true={exportSearch}>
                                <button class="search-clear" onclick={clearExportSearch}>✕</button>
                            </template>
                        </div>
                        <template if:true={canExportCsv}>
                            <button class="csv-btn" onclick={downloadExportCsv} title="Download CSV">Download CSV ⬇</button>
                        </template>
                        <template if:false={canExportCsv}>
                            <span class="csv-locked" title={csvLockedTitle}>🔒 Export restricted</span>
                        </template>
                    </div>
                </div>
                <div class="filter-bar">
                    <span class="filter-label">Profile:</span>
                    <select class="filter-select" onchange={handleExportProfileFilter}>
                        <option value="">All Profiles</option>

                                    <td class="cell-date">{a.createdDate}</td>
                                    <td class="cell-name">
                                        <template if:true={a.createdById}><a class="user-link" data-url={a.userUrl} onclick={handleLinkClick}>{a.createdByName}</a></template>
                                        <template if:false={a.createdById}>{a.createdByName}</template>
                                    </td>
                                    <td class="cell-section">{a.section}</td>
                                    <td class="cell-mono cell-action">{a.action}</td>
                                    <td class="cell-detail-wrap">{a.display}</td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                    <template if:true={auditNoResults}><div class="no-results">No events match your search or filters.</div></template>
                </div>
            </template>
            <template if:false={hasAuditEvents}><div class="empty-state">✓ No audit events found in this time range</div></template>
        </div>
    </template>

    <!-- ── RULE TOOLTIP POPOVER ── -->
    <template if:true={rulePopoverVisible}>
        <div class="rule-popover"
             style={rulePopoverStyle}
             onmouseenter={handlePopoverEnter}
             onmouseleave={handlePopoverLeave}>
            <div class="rule-popover-title">{rulePopoverTitle}</div>
            <ul class="rule-popover-list">
                <template for:each={rulePopoverItems} for:item="item">
                    <li key={item.id} class="rule-popover-item">
                        <span class={item.sevCls}>{item.id}</span>
                        <div>
                            <div class="rule-item-name">{item.name}</div>
                            <div class="rule-item-logic">{item.logic}</div>
                        </div>
                    </li>
                </template>
            </ul>
        </div>
    </template>

    <!-- ── FOOTER ── -->
    <footer class="soc-footer">
        Salesforce SOC Dashboard · Data sourced from User, Profile, LoginHistory, SetupAuditTrail · Dormant = no login ≥ 90 days
    </footer>

</div>
</template>
